name = "werewolf-ai"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding for Cloudflare Pages
[[d1_databases]]
binding = "DB"
database_name = "werewolf-ai-db"
database_id = "9bb1334e-c75f-49b2-9e8c-a79771de46d4"

[vars]
NODE_ENV = "production"
NEXTAUTH_URL = "https://werewolf-ai.me-f9a.workers.dev"

# Environment variables will be set via wrangler secret put
# NEXTAUTH_URL
# NEXTAUTH_SECRET
# GOOGLE_API_KEY
# GROQ_API_KEY
# etc.
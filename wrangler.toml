# Mafia Arena - Cloudflare Workers Configuration
name = "mafia-arena"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain Routes - API subdomain
[[routes]]
pattern = "api.mafia-arena.com"
custom_domain = true

# Enable Smart Placement for cost optimization
[placement]
mode = "smart"

# =============================================================================
# WORKFLOWS - Native Cloudflare Workflows for game orchestration
# =============================================================================

[[workflows]]
name = "mafia-workflow"
binding = "MAFIA_WORKFLOW"
class_name = "MafiaWorkflow"

# Durable Objects
[durable_objects]
bindings = [
  { name = "GAME_RUNNER", class_name = "GameRunner" }
]

[[migrations]]
tag = "v1"
new_classes = ["GameRunner"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mafia-arena"
database_id = "936cd74b-f2c4-4739-a9a6-c65e00bc9f8e"

# R2 Bucket for transcripts
[[r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "mafia-arena-transcripts"
preview_bucket_name = "mafia-arena-transcripts-preview"

# KV Namespace for rate limiting and circuit breaker
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "98c5d7e961cb44e6bd8246eff27444a8"
preview_id = "825aa0ec9d4b46ddbcefddebf266158b"

# =============================================================================
# QUEUES - Hierarchical processing system
# =============================================================================

# Batch Queue - receives large batch requests (up to 10,000 games)
[[queues.producers]]
queue = "mafia-arena-batches"
binding = "BATCH_QUEUE"

[[queues.consumers]]
queue = "mafia-arena-batches"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "mafia-arena-dlq"

# Game Queue - individual game processing
[[queues.producers]]
queue = "mafia-arena-games"
binding = "GAME_QUEUE"

[[queues.consumers]]
queue = "mafia-arena-games"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 3
max_concurrency = 50
dead_letter_queue = "mafia-arena-dlq"

# NOTE: AI Request Queue removed - Workflows handle AI calls natively via step.do()

# =============================================================================
# ANALYTICS ENGINE - Real-time metrics without D1 load
# =============================================================================

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mafia_events"

# =============================================================================
# CRON TRIGGERS - Scheduled jobs for batch API processing
# =============================================================================

[triggers]
crons = [
  # Poll batch jobs for completion every minute
  # - Checks status of submitted jobs with AI providers
  # - Updates D1 batch_api_requests table for Workflow polling
  "*/1 * * * *",
  
  # Aggregate pending batch requests every 5 minutes
  # - Bundles pending discountPricing AI requests
  # - Submits batches to provider APIs (OpenAI, Anthropic, Google, etc.)
  "*/5 * * * *"
  
  # NOTE: Cleanup cron removed - Workflows handle timeouts natively
]

# Environment Variables
[vars]
ENVIRONMENT = "production"

# Development environment
[env.development]
name = "mafia-arena-dev"
[env.development.vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "mafia-arena"

# =============================================================================
# SECRETS (set via `wrangler secret put`)
# =============================================================================
# Required secrets:
#   - ADMIN_USERNAME       (legacy Basic Auth)
#   - ADMIN_PASSWORD       (legacy Basic Auth)
#   - OPENROUTER_API_KEY   (for AI models)
#   - OPENAI_API_KEY       (optional, direct OpenAI access)
#   - ANTHROPIC_API_KEY    (optional, direct Anthropic access)
#   - GOOGLE_API_KEY       (optional, direct Google Gemini access)
#
# Google OAuth secrets (recommended - replaces Basic Auth):
#   - GOOGLE_CLIENT_ID     (OAuth 2.0 Client ID)
#   - GOOGLE_CLIENT_SECRET (OAuth 2.0 Client Secret)
#   - ADMIN_EMAIL          (email address of admin user)
#
# To set secrets:
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put ADMIN_EMAIL


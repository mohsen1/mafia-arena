# Mafia Arena - Cloudflare Workers Configuration
name = "mafia-arena"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Enable Smart Placement for cost optimization
[placement]
mode = "smart"

# Durable Objects
[durable_objects]
bindings = [
  { name = "GAME_RUNNER", class_name = "GameRunner" }
]

[[migrations]]
tag = "v1"
new_classes = ["GameRunner"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mafia-arena"
database_id = "936cd74b-f2c4-4739-a9a6-c65e00bc9f8e"

# R2 Bucket for transcripts
[[r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "mafia-arena-transcripts"
preview_bucket_name = "mafia-arena-transcripts-preview"

# KV Namespace for rate limiting and circuit breaker
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "98c5d7e961cb44e6bd8246eff27444a8"
preview_id = "825aa0ec9d4b46ddbcefddebf266158b"

# =============================================================================
# QUEUES - Hierarchical processing system
# =============================================================================

# Batch Queue - receives large batch requests (up to 10,000 games)
[[queues.producers]]
queue = "mafia-arena-batches"
binding = "BATCH_QUEUE"

[[queues.consumers]]
queue = "mafia-arena-batches"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "mafia-arena-dlq"

# Game Queue - individual game processing
[[queues.producers]]
queue = "mafia-arena-games"
binding = "GAME_QUEUE"

[[queues.consumers]]
queue = "mafia-arena-games"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 3
max_concurrency = 50
dead_letter_queue = "mafia-arena-dlq"

# AI Request Queue - offloaded AI calls that may take 60s+
# This allows the DO to hibernate while waiting for AI responses
[[queues.producers]]
queue = "mafia-arena-ai-requests"
binding = "AI_REQUEST_QUEUE"

[[queues.consumers]]
queue = "mafia-arena-ai-requests"
max_batch_size = 5  # Keep low to avoid rate limits
max_batch_timeout = 30
max_retries = 5     # More retries for transient AI failures
max_concurrency = 20
dead_letter_queue = "mafia-arena-dlq"

# =============================================================================
# ANALYTICS ENGINE - Real-time metrics without D1 load
# =============================================================================

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mafia_events"

# =============================================================================
# CRON TRIGGERS - Scheduled jobs
# =============================================================================

[triggers]
# Run cleanup every 10 minutes to detect and kill stale games
# - Standard games: stale after 1 hour of inactivity
# - Discount pricing games: stale after 24 hours (batch APIs can take up to 24h)
crons = ["*/10 * * * *"]

# Environment Variables
[vars]
ENVIRONMENT = "development"

# Development environment
[env.development]
name = "mafia-arena-dev"

# Production environment
[env.production]
name = "mafia-arena"


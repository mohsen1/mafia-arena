name = "werewolf-ai"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding for Cloudflare Pages
[[d1_databases]]
binding = "DB"
database_name = "werewolf-ai-db"
database_id = "9bb1334e-c75f-49b2-9e8c-a79771de46d4"

[vars]
NODE_ENV = "production"
NEXTAUTH_URL = "https://werewolf-ai.me-f9a.workers.dev"
DATABASE_URL = "placeholder-for-d1-binding"

[observability]
enabled = true

# Secrets should be set via: wrangler secret put <SECRET_NAME>
# Required secrets:
# - NEXTAUTH_SECRET
# - GROQ_API_KEY
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
# - GEMINI_API_KEY

# Environment variables will be set via wrangler secret put
# NEXTAUTH_URL
# NEXTAUTH_SECRET
# GOOGLE_API_KEY
# GROQ_API_KEY
# etc.
name: Vercel Deployment Monitor

on:
  # Monitor deployments on push to main and PR updates
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also allow manual triggering
  workflow_dispatch:
  # Run daily to check deployment health (reduced from every 15 minutes)
  schedule:
    - cron: '0 9 * * *' # Daily at 9 AM UTC

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  monitor-deployment:
    name: Monitor Vercel Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ VERCEL_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "❌ VERCEL_ORG_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ VERCEL_PROJECT_ID secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Setup Vercel environment
        run: |
          echo "Setting up Vercel environment..."
          vercel --version

      - name: Get latest deployment status
        id: deployment-check
        continue-on-error: true
        run: |
          echo "Checking latest deployment status..."
          
          # Get the latest deployment with better error handling
          DEPLOYMENT_INFO=$(vercel ls --scope ${{ secrets.VERCEL_ORG_ID }} --token $VERCEL_TOKEN 2>/dev/null | head -2 | tail -1 || echo "")
          
          if [ -z "$DEPLOYMENT_INFO" ]; then
            echo "No deployments found or API error"
            echo "status=no-deployments" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extract deployment URL and status
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_INFO" | awk '{print $1}')
          DEPLOYMENT_STATE=$(echo "$DEPLOYMENT_INFO" | awk '{print $2}')
          
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "deployment_state=$DEPLOYMENT_STATE" >> $GITHUB_OUTPUT
          echo "status=$DEPLOYMENT_STATE" >> $GITHUB_OUTPUT
          
          echo "Latest deployment: $DEPLOYMENT_URL"
          echo "Deployment state: $DEPLOYMENT_STATE"

      - name: Get deployment details on failure
        id: deployment-details
        if: steps.deployment-check.outputs.status == 'ERROR' || steps.deployment-check.outputs.status == 'FAILED'
        run: |
          echo "Getting detailed deployment information..."
          DEPLOYMENT_URL="${{ steps.deployment-check.outputs.deployment_url }}"
          
          # Get detailed deployment info
          DEPLOYMENT_DETAILS=$(vercel inspect $DEPLOYMENT_URL --token $VERCEL_TOKEN 2>&1 || echo "Failed to get details")
          
          # Get deployment logs
          DEPLOYMENT_LOGS=$(vercel logs $DEPLOYMENT_URL --token $VERCEL_TOKEN 2>&1 || echo "Failed to get logs")
          
          # Prepare issue body content
          cat > deployment_failure_details.md << 'EOF'
          ## 🚨 Vercel Deployment Failure Report
          
          **Deployment URL:** $DEPLOYMENT_URL
          **Status:** ${{ steps.deployment-check.outputs.deployment_state }}
          **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Triggered by:** ${{ github.event_name }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}
          
          ### Deployment Details
          ```
          $DEPLOYMENT_DETAILS
          ```
          
          ### Recent Deployment Logs
          ```
          $DEPLOYMENT_LOGS
          ```
          
          ### Possible Causes
          - Database migration failure
          - Build process errors
          - Environment variable issues
          - Dependency installation problems
          - Runtime errors
          
          ### Troubleshooting Steps
          1. Check the build logs above for specific error messages
          2. Verify all environment variables are properly set
          3. Ensure database is accessible and migrations are working
          4. Test the build process locally: `pnpm run check-db && pnpm run db:migrate && pnpm run db:push && pnpm run build`
          5. Check for any recent changes that might have caused the failure
          
          ### Auto-generated by
          [Vercel Deployment Monitor Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          
          echo "details_file=deployment_failure_details.md" >> $GITHUB_OUTPUT

      - name: Check for existing failure issue
        id: existing-issue
        if: steps.deployment-check.outputs.status == 'ERROR' || steps.deployment-check.outputs.status == 'FAILED'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment-failure,automated'
            });
            
            // Check if there's already an open deployment failure issue
            const existingIssue = issues.find(issue => 
              issue.title.includes('Vercel Deployment Failure') && 
              issue.state === 'open'
            );
            
            if (existingIssue) {
              core.setOutput('existing_issue_number', existingIssue.number);
              core.setOutput('has_existing_issue', 'true');
            } else {
              core.setOutput('has_existing_issue', 'false');
            }

      - name: Create GitHub issue for deployment failure
        if: (steps.deployment-check.outputs.status == 'ERROR' || steps.deployment-check.outputs.status == 'FAILED') && steps.existing-issue.outputs.has_existing_issue == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = fs.readFileSync('${{ steps.deployment-details.outputs.details_file }}', 'utf8');
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Vercel Deployment Failure - ${{ steps.deployment-check.outputs.deployment_url }}',
              body: issueBody,
              labels: ['deployment-failure', 'automated', 'bug', 'priority:high']
            });
            
            console.log(`Created issue #${issue.number}: ${issue.html_url}`);

      - name: Update existing issue with new failure info
        if: (steps.deployment-check.outputs.status == 'ERROR' || steps.deployment-check.outputs.status == 'FAILED') && steps.existing-issue.outputs.has_existing_issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const newFailureInfo = fs.readFileSync('${{ steps.deployment-details.outputs.details_file }}', 'utf8');
            
            const commentBody = `
            ## 🔄 New Deployment Failure Detected
            
            ${newFailureInfo}
            
            ---
            *This is an automated update. Previous deployment failures may be documented above.*
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.existing-issue.outputs.existing_issue_number }},
              body: commentBody
            });
            
            console.log(`Updated existing issue #${{ steps.existing-issue.outputs.existing_issue_number }} with new failure information`);

      - name: Close resolved deployment issues
        if: steps.deployment-check.outputs.status == 'READY' || steps.deployment-check.outputs.status == 'SUCCESS'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment-failure,automated'
            });
            
            for (const issue of issues) {
              if (issue.title.includes('Vercel Deployment Failure')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ **Deployment Resolved**
                  
                  The latest Vercel deployment is now successful:
                  - **Status:** ${{ steps.deployment-check.outputs.deployment_state }}
                  - **URL:** ${{ steps.deployment-check.outputs.deployment_url }}
                  - **Time:** ${new Date().toISOString()}
                  
                  Automatically closing this issue.`
                });
                
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                
                console.log(`Closed resolved deployment issue #${issue.number}`);
              }
            }

      - name: Notify deployment status
        run: |
          echo "Deployment monitoring completed"
          echo "Status: ${{ steps.deployment-check.outputs.status }}"
          echo "URL: ${{ steps.deployment-check.outputs.deployment_url }}"
          
          case "${{ steps.deployment-check.outputs.status }}" in
            "READY"|"SUCCESS")
              echo "✅ Deployment is healthy"
              ;;
            "ERROR"|"FAILED")
              echo "❌ Deployment failed - GitHub issue created/updated"
              ;;
            "BUILDING"|"PENDING")
              echo "⏳ Deployment in progress"
              ;;
            "no-deployments")
              echo "ℹ️ No deployments found"
              ;;
            *)
              echo "❓ Unknown deployment status"
              ;;
          esac 
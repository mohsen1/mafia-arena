name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          NEXTAUTH_SECRET: "build-time-secret-will-be-replaced"
          NEXTAUTH_URL: "https://werewolf-ai.pages.dev"
          DATABASE_URL: "file:./placeholder.db"
          GEMINI_API_KEY: "build-time-placeholder"
          GOOGLE_API_KEY: "build-time-placeholder"
          GROQ_API_KEY: "build-time-placeholder"
          OPENAI_API_KEY: "build-time-placeholder"
          ANTHROPIC_API_KEY: "build-time-placeholder"

      - name: Create Vercel output structure
        run: |
          mkdir -p .vercel/output
          echo '{"version":3}' > .vercel/output/config.json
          # Remove cache directory to avoid file size limits (142 MiB cache > 25 MiB limit)
          rm -rf .next/cache
          cp -r .next .vercel/output/static

      - name: Convert to Cloudflare Pages format
        run: npx @cloudflare/next-on-pages --skip-build
        continue-on-error: false
        
      - name: Debug - Check generated files
        run: |
          echo "Contents of .vercel/output/static:"
          ls -la .vercel/output/static/ || true
          echo "Worker file exists:"
          ls -la .vercel/output/static/_worker.js/ || true
          echo "Routes file:"
          cat .vercel/output/static/_routes.json || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f9a5434fcf66ee00d67b61f2f67e0e22
          command: pages deploy .vercel/output/static --project-name=werewolf-ai --branch=${{ github.ref_name }} --compatibility-date=2024-01-01

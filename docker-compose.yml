version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: werewolf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: werewolf_dev_password
      POSTGRES_DB: werewolf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: werewolf_postgres_data 
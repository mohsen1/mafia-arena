name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm pages:build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          # NextAuth backward compatibility
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "https://werewolf-ai.me-f9a.workers.dev"
          # Melody Auth variables (new - backward compatible)
          AUTH_SERVER_URL: "https://werewolf-ai.me-f9a.workers.dev"
          AUTH_JWT_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_COOKIE_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Database and other services
          DATABASE_URL: "file:./placeholder.db"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Feature flag - Melody disabled initially for safe deployment
          FEATURE_MELODY_AUTH: "false"
        
      - name: Debug - Check generated files
        run: |
          echo "Contents of .open-next or .worker-next:"
          ls -la .open-next/ || ls -la .worker-next/ || echo "Output directory not found"
          echo "Checking for worker files:"
          find . -name "*.worker.js" -o -name "_worker.js" | head -10

      - name: Deploy to Cloudflare with OpenNext
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Worker Secrets
        run: |
          echo "Setting Worker secrets..."
          # NextAuth secrets (backward compatibility)
          echo "${{ secrets.NEXTAUTH_SECRET }}" | pnpm wrangler secret put NEXTAUTH_SECRET
          # Melody Auth secrets (new - same values as NextAuth for compatibility)
          echo "${{ secrets.NEXTAUTH_SECRET }}" | pnpm wrangler secret put AUTH_JWT_SECRET
          echo "${{ secrets.NEXTAUTH_SECRET }}" | pnpm wrangler secret put AUTH_COOKIE_SECRET
          echo "https://werewolf-ai.me-f9a.workers.dev" | pnpm wrangler secret put AUTH_SERVER_URL
          # OAuth credentials (used by both systems)
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | pnpm wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | pnpm wrangler secret put GOOGLE_CLIENT_SECRET
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | pnpm wrangler secret put AUTH_GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | pnpm wrangler secret put AUTH_GOOGLE_CLIENT_SECRET
          # API keys
          echo "${{ secrets.GROQ_API_KEY }}" | pnpm wrangler secret put GROQ_API_KEY
          echo "${{ secrets.OPENAI_API_KEY }}" | pnpm wrangler secret put OPENAI_API_KEY
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | pnpm wrangler secret put ANTHROPIC_API_KEY
          echo "${{ secrets.GEMINI_API_KEY }}" | pnpm wrangler secret put GEMINI_API_KEY
          # Feature flag - Melody disabled initially
          echo "false" | pnpm wrangler secret put FEATURE_MELODY_AUTH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

